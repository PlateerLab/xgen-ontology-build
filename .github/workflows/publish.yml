name: Publish

# PyPI publishing runs from the origin repository, PlateerLab/xgen-ontology-build.
# Any organization member with write access publishes by creating a GitHub Release.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    if: github.repository == 'PlateerLab/xgen-ontology-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
